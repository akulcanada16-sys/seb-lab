name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research_core/requirements.txt
      - run: python -m unittest discover -s research_core -p "test_*.py" -v
      - run: python research_core/cli.py --output /tmp/seb-result.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.cjs
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check web/terminal.js && node --check web/research-worker.mjs
